<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史高光</title>
  <!-- 引入Video.js CSS -->
  <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet" />
  <!-- 引入Video.js JS -->
  <script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
  <style>
    /* 原始HTML风格样式 */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 30px 0;
      background-color: #333;
      color: white;
      border: 1px solid #000;
    }

    header h1 {
      font-size: 2em;
      margin: 0;
      font-weight: bold;
    }

    header p {
      font-size: 1em;
      margin: 10px 0 0 0;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .highlight-card {
      background-color: white;
      border: 1px solid #ccc;
      padding: 15px;
    }

    .cover-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .cover-image.loading {
      opacity: 0;
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .card-content {
      padding: 15px 0;
    }

    .card-content h3 {
      font-size: 1.2em;
      margin: 0 0 10px 0;
      color: #333;
    }

    .card-content p {
      color: #666;
      margin: 0;
    }

    .play-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #333;
      color: white;
      border: 1px solid #000;
      cursor: pointer;
      font-size: 1em;
      text-align: center;
    }

    .play-btn:hover {
      background-color: #555;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
    }

    .video-wrapper video {
      width: 100%;
      border: 1px solid #ccc;
    }

    .close-btn {
      position: absolute;
      top: -30px;
      right: 0;
      background-color: #333;
      color: white;
      border: 1px solid #000;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 1em;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .pagination-btn {
      background-color: #333;
      color: white;
      border: 1px solid #000;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    .pagination-btn:hover {
      background-color: #555;
    }

    .pagination-btn.active {
      background-color: #666;
      font-weight: bold;
    }

    /* 响应式布局 */
    @media (max-width: 768px) {
      .highlights-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      header h1 {
        font-size: 1.5em;
      }

      .highlight-card {
        max-width: 100%;
      }

      .cover-image {
        height: 150px;
      }

      .image-container {
        height: 150px;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="page-title">历史高光</h1>
      <p>偷着乐</p>
    </header>

    <div class="highlights-grid" id="highlights-container">
      <!-- 动态生成内容 -->
    </div>
    
    <div class="pagination" id="pagination">
      <!-- 分页按钮将动态生成 -->
    </div>
  </div>

  <div class="video-container" id="video-container" style="display: none;">
    <div class="video-wrapper">
      <button class="close-btn" id="close-btn">&times;</button>
      <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
        <p class="vjs-no-js">
          要观看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器
        </p>
      </video>
    </div>
  </div>

  <script>
    // 视频列表数据
    let videos = [];
    // 当前播放器实例
    let currentPlayer = null;
    // 当前页码
    let currentPage = 1;
    // 每页显示的视频数量
    const videosPerPage = 5;
    // 视频数据缓存
    const videoDataCache = new Map();
    // 最大尝试的视频ID
    const maxVideoId = 50; // 防止无限循环

    // 从URL获取参数
    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 加载单个视频的JSON数据（带缓存）
    async function loadVideoData(videoId) {
      // 检查缓存
      if (videoDataCache.has(videoId)) {
        return videoDataCache.get(videoId);
      }
      
      try {
        const response = await fetch(`data/${videoId}.json`);
        if (!response.ok) {
          throw new Error(`无法加载视频 ${videoId}`);
        }
        const data = await response.json();
        // 存入缓存
        videoDataCache.set(videoId, data);
        return data;
      } catch (error) {
        console.error('加载视频数据失败:', error);
        // 缓存失败结果，避免重复请求
        videoDataCache.set(videoId, null);
        return null;
      }
    }

    // 自动扫描data目录中的所有JSON文件（并行加载）
    async function scanVideoFiles() {
      const videoList = [];
      const loadPromises = [];
      
      // 创建所有加载请求
      for (let videoId = 1; videoId <= maxVideoId; videoId++) {
        loadPromises.push(
          loadVideoData(videoId).then(data => {
            if (data) {
              return {
                id: videoId,
                title: data.title || `视频${videoId}`,
                description: data.description || '',
                coverImage: data.coverImage || '',
                videoUrl: data.videoUrl || ''
              };
            }
            return null;
          })
        );
      }
      
      // 并行加载所有视频数据
      const results = await Promise.all(loadPromises);
      
      // 过滤掉null结果并按ID排序
      results.forEach(result => {
        if (result) {
          videoList.push(result);
        }
      });
      
      return videoList;
    }

    // 更新URL参数
    function updateUrlParam(videoId, page) {
      const url = new URL(window.location.href);
      if (videoId) {
        url.searchParams.set('id', videoId);
      } else {
        url.searchParams.delete('id');
      }
      
      if (page) {
        url.searchParams.set('page', page);
      } else {
        url.searchParams.delete('page');
      }
      
      window.history.pushState({ videoId, page }, '', url);
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', async function() {
      // 扫描视频文件
      videos = await scanVideoFiles();
      
      // 获取URL中的页码参数
      const pageParam = parseInt(getUrlParam('page'));
      if (pageParam && pageParam > 0) {
        currentPage = pageParam;
      }
      
      // 渲染视频列表
      renderVideoList();
      
      // 绑定关闭按钮事件
      bindCloseEvents();
      
      // 检查URL中是否有id参数，如果有则自动播放对应视频
      const videoId = parseInt(getUrlParam('id'));
      if (videoId) {
        await openVideoById(videoId);
      }
    });

    // 渲染视频列表
    function renderVideoList() {
      const container = document.getElementById('highlights-container');
      if (container) {
        container.innerHTML = '';
        
        // 计算当前页的视频
        const startIndex = (currentPage - 1) * videosPerPage;
        const endIndex = startIndex + videosPerPage;
        const currentVideos = videos.slice(startIndex, endIndex);
        
        if (currentVideos.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #999;">暂无视频</p>';
          return;
        }
        
        currentVideos.forEach(video => {
          const card = document.createElement('div');
          card.className = 'highlight-card';
          
          const hasCoverImage = video.coverImage && video.coverImage.trim() !== '';
          const coverImageHTML = hasCoverImage ? 
            `<img class="cover-image loading" src="" data-src="${video.coverImage}" alt="${video.title}" data-id="${video.id}" data-video="${video.videoUrl}" loading="lazy">` : 
            '<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #999;">暂无封面</div>';
          
          const hasVideoUrl = video.videoUrl && video.videoUrl.trim() !== '';
          const playButtonHTML = hasVideoUrl ? 
            `<button class="play-btn" data-id="${video.id}">播放视频</button>` : 
            '<button class="play-btn" disabled style="background-color: #999; cursor: not-allowed;">敬请期待</button>';
          
          card.innerHTML = `
            <div class="image-container">
              ${hasCoverImage ? '<div class="loading-spinner"></div>' : ''}
              ${coverImageHTML}
            </div>
            <div class="card-content">
              <h3>${video.title}</h3>
              <p>${video.description}</p>
              ${playButtonHTML}
            </div>
          `;
          container.appendChild(card);
        });

        // 懒加载图片
        lazyLoadImages();
        
        // 绲染分页导航
        renderPagination();
        
        // 绑定事件监听器
        bindVideoEvents();
      }
    }
    
    // 懒加载图片
    function lazyLoadImages() {
      const images = document.querySelectorAll('.cover-image[data-src]');
      
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            const src = img.getAttribute('data-src');
            
            if (src) {
              img.src = src;
              img.addEventListener('load', function() {
                this.classList.remove('loading');
                const spinner = this.parentElement.querySelector('.loading-spinner');
                if (spinner) {
                  spinner.style.display = 'none';
                }
              });
              
              img.addEventListener('error', function() {
                this.style.display = 'none';
                const container = this.parentElement;
                const noCoverDiv = document.createElement('div');
                noCoverDiv.style.cssText = 'width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #999;';
                noCoverDiv.textContent = '暂无封面';
                container.appendChild(noCoverDiv);
                const spinner = container.querySelector('.loading-spinner');
                if (spinner) {
                  spinner.style.display = 'none';
                }
              });
            }
            
            observer.unobserve(img);
          }
        });
      }, {
        rootMargin: '50px 0px',
        threshold: 0.1
      });
      
      images.forEach(img => {
        imageObserver.observe(img);
      });
    }
    
    // 渲染分页导航
    function renderPagination() {
      const pagination = document.getElementById('pagination');
      if (pagination) {
        pagination.innerHTML = '';
        
        const totalPages = Math.ceil(videos.length / videosPerPage);
        
        if (totalPages <= 1) {
          return; // 只有一页时不显示分页
        }
        
        // 上一页按钮
        if (currentPage > 1) {
          const prevBtn = document.createElement('button');
          prevBtn.className = 'pagination-btn';
          prevBtn.textContent = '上一页';
          prevBtn.onclick = function() {
            goToPage(currentPage - 1);
          };
          pagination.appendChild(prevBtn);
        }
        
        // 页码按钮
        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement('button');
          pageBtn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
          pageBtn.textContent = i;
          pageBtn.onclick = function() {
            goToPage(i);
          };
          pagination.appendChild(pageBtn);
        }
        
        // 下一页按钮
        if (currentPage < totalPages) {
          const nextBtn = document.createElement('button');
          nextBtn.className = 'pagination-btn';
          nextBtn.textContent = '下一页';
          nextBtn.onclick = function() {
            goToPage(currentPage + 1);
          };
          pagination.appendChild(nextBtn);
        }
      }
    }
    
    // 跳转到指定页面
    function goToPage(page) {
      currentPage = page;
      updateUrlParam(null, page);
      renderVideoList();
      window.scrollTo(0, 0);
    }

    // 绑定视频播放相关事件
    function bindVideoEvents() {
      // 封面图片点击事件
      document.querySelectorAll('.cover-image').forEach(img => {
        img.addEventListener('click', function() {
          const videoId = this.getAttribute('data-id');
          if (videoId) {
            openVideoById(parseInt(videoId));
          }
        });
      });

      // 播放按钮点击事件
      document.querySelectorAll('.play-btn').forEach(btn => {
        const videoId = btn.getAttribute('data-id');
        if (videoId) {
          btn.addEventListener('click', function() {
            openVideoById(parseInt(videoId));
          });
        }
      });
    }
    
    // 根据视频ID打开视频
    async function openVideoById(videoId) {
      // 更新URL参数
      updateUrlParam(videoId);
      
      // 加载视频数据
      const videoData = await loadVideoData(videoId);
      
      if (!videoData || !videoData.videoUrl || videoData.videoUrl.trim() === '') {
        alert('视频链接无效，请稍后再试');
        updateUrlParam(null);
        return;
      }
      
      // 打开视频
      openVideo(videoData.videoUrl);
    }

    // 绑定关闭相关事件
    function bindCloseEvents() {
      // 关闭按钮点击事件
      const closeBtn = document.getElementById('close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          closeVideo();
        });
      }

      // 点击视频容器外部关闭
      const videoContainer = document.getElementById('video-container');
      if (videoContainer) {
        videoContainer.addEventListener('click', function(e) {
          if (e.target === this) {
            closeVideo();
          }
        });
      }
    }

    // 打开视频
    function openVideo(videoUrl) {
      try {
        // 验证视频URL
        if (!videoUrl || videoUrl.trim() === '') {
          alert('视频链接无效，请稍后再试');
          return;
        }
        
        // 确保先关闭之前的视频
        closeVideo();
        
        // 获取视频容器和包装器
        const videoContainer = document.getElementById('video-container');
        const videoWrapper = document.querySelector('.video-wrapper');
        
        if (!videoContainer || !videoWrapper) {
          console.error('视频容器或包装器不存在');
          return;
        }
        
        // 移除旧的video元素
        const oldVideoElement = document.getElementById('video-player');
        if (oldVideoElement) {
          videoWrapper.removeChild(oldVideoElement);
        }
        
        // 创建新的Video.js视频元素
        const newVideoElement = document.createElement('video');
        newVideoElement.id = 'video-player';
        newVideoElement.className = 'video-js vjs-default-skin vjs-big-play-centered';
        newVideoElement.controls = true;
        newVideoElement.innerHTML = '<p class="vjs-no-js">要观看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器</p>';
        
        // 插入新的视频元素
        const closeBtn = document.getElementById('close-btn');
        if (closeBtn) {
          videoWrapper.insertBefore(newVideoElement, closeBtn);
        } else {
          videoWrapper.appendChild(newVideoElement);
        }
        
        // 初始化Video.js播放器
        currentPlayer = videojs('video-player', {
          controls: true,
          autoplay: true,
          preload: 'auto',
          responsive: true,
          fluid: true
        });
        
        // 添加错误处理
        currentPlayer.on('error', function() {
          console.error('视频加载失败:', currentPlayer.error());
          alert('视频加载失败，可能是因为网络问题或格式不支持');
          closeVideo();
        });
        
        // 设置视频源并播放
        currentPlayer.src(videoUrl);
        currentPlayer.play();
        
        // 显示视频容器
        videoContainer.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      } catch (error) {
        console.error('打开视频失败:', error);
        // 显示错误消息
        alert('视频播放失败，请稍后再试');
      }
    }

    // 关闭视频
    function closeVideo() {
      try {
        // 停止视频并释放播放器
        if (currentPlayer) {
          currentPlayer.pause();
          currentPlayer.dispose();
          currentPlayer = null;
        }
        
        // 更新URL参数，移除id
        updateUrlParam(null);
        
        // 获取视频容器和包装器
        const videoContainer = document.getElementById('video-container');
        const videoWrapper = document.querySelector('.video-wrapper');
        
        if (!videoContainer || !videoWrapper) {
          return;
        }
        
        // 移除旧的video元素
        const oldVideoElement = document.getElementById('video-player');
        if (oldVideoElement) {
          videoWrapper.removeChild(oldVideoElement);
        }
        
        // 创建新的Video.js视频元素
        const newVideoElement = document.createElement('video');
        newVideoElement.id = 'video-player';
        newVideoElement.className = 'video-js vjs-default-skin vjs-big-play-centered';
        newVideoElement.controls = true;
        newVideoElement.innerHTML = '<p class="vjs-no-js">要观看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器</p>';
        
        // 插入新的视频元素
        const closeBtn = document.getElementById('close-btn');
        if (closeBtn) {
          videoWrapper.insertBefore(newVideoElement, closeBtn);
        } else {
          videoWrapper.appendChild(newVideoElement);
        }
        
        // 隐藏视频容器
        videoContainer.style.display = 'none';
        document.body.style.overflow = 'auto';
      } catch (error) {
        console.error('关闭视频失败:', error);
      }
    }
  </script>
</body>
</html>
