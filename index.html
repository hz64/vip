<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史高光</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@2/dist/waline.css" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="list-page">
    <div class="container">
      <header>
        <h1>历史高光</h1>
        <p>偷着乐</p>
      </header>
      <div class="highlights-grid" id="highlights-container"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="video-page" style="display: none;">
    <div class="container">
      <header>
        <h1>历史高光</h1>
        <p>偷着乐</p>
      </header>
      <button class="back-btn" id="back-btn">← 返回列表</button>
      <div class="video-card">
        <div class="video-player-wrapper">
          <video id="video-player" class="video-js vjs-big-play-centered" controls preload="metadata" playsinline data-setup='{"fluid": true, "controlsList": ["nodownload", "nofullscreen", "noremoteplayback"]}'>
            <p class="vjs-no-js">您的浏览器不支持视频播放，请升级浏览器</p>
          </video>
        </div>
        <div class="video-details">
          <h2 id="video-title"></h2>
          <p id="video-description"></p>
        </div>
      </div>
      <div class="comments-section">
        <h3>评论区</h3>
        <div id="waline-container"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@waline/client@2/dist/waline.js"></script>
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
